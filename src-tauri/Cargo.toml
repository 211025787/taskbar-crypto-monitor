[package]
name = "taskbar-crypto-monitor"
version = "0.1.0"
description = "Binance USDⓈ-M 永续合约任务栏行情监控（胶囊 UI 覆盖任务栏）"
authors = ["wu211"]
edition = "2021"

# 目标平台仅 Windows 11 x64 桌面：main.rs 通过 rlib 链接本库
# （cdylib/staticlib 仅移动端需要，且会触发 GNU ld 导出序号超限错误）
[lib]
name = "taskbar_crypto_monitor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 单实例锁：重复启动时聚焦已有实例，避免任务栏出现多个胶囊
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 轻量同步 HTTP 客户端：仅用于拉取 Binance exchangeInfo 合约列表
ureq = { version = "2", features = ["json"] }
# 异步 WebSocket 客户端：连接 Binance 行情流（复用 Tauri 内置 tokio 运行时）
# rustls + 内置 WebPKI 根证书：纯 Rust TLS，避免 GNU 工具链的 OpenSSL 链接问题
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# 异步运行时直接依赖（Tauri 内置 tokio，此处声明 time 特性用于重连退避 sleep）
tokio = { version = "1", features = ["time"] }
# Win32 API 绑定：仅用于任务栏几何探测与窗口定位（SetWindowPos 等）
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 体积优化：后台常驻行情工具追求小体积与低开销
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
